<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - JPupper Projects System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Login Form -->
            <div id="loginForm" class="col-md-4 offset-md-4 mt-5">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Admin Login</h3>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="accessCode" class="form-label">Código de Acceso</label>
                                <input type="password" class="form-control" id="accessCode" placeholder="Ingrese el código..." required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Projects Panel (hidden by default) -->
            <div id="projectsPanel" class="col-12" style="display: none;">
                <div class="d-flex justify-content-between align-items-center my-4">
                    <div>
                        <h2 class="mb-0">JPupper Projects - Admin Panel</h2>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="api.html" class="btn btn-outline-info btn-sm">
                            <i class="bi bi-code-square"></i> Public API
                        </a>
                        <button class="btn btn-danger btn-sm" onclick="logout()">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <ul class="nav nav-tabs mb-3" id="adminTabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" id="projects-tab" data-bs-toggle="tab" data-bs-target="#projects-content" type="button">
                            <i class="bi bi-folder"></i> Projects
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="budgets-tab" data-bs-toggle="tab" data-bs-target="#budgets-content" type="button">
                            <i class="bi bi-receipt"></i> Presupuestos
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="tags-tab" data-bs-toggle="tab" data-bs-target="#tags-content" type="button">
                            <i class="bi bi-tags"></i> Tags Library
                        </button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content" id="adminTabsContent">
                    <!-- Projects Tab -->
                    <div class="tab-pane fade show active" id="projects-content">
                        <div class="d-flex justify-content-between align-items-center my-3">
                            <h4 class="mb-0">Projects</h4>
                            <button class="btn btn-primary" onclick="showAddProjectForm()">
                                <i class="bi bi-plus-circle"></i> Add Project
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped align-middle">
                                <thead>
                                    <tr>
                                        <th style="width: 120px">Thumbnail</th>
                                        <th>Title</th>
                                        <th>Description</th>
                                        <th>URL</th>
                                        <th>Tags</th>
                                        <th style="width: 150px">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="projectsList"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Budgets Tab -->
                    <div class="tab-pane fade" id="budgets-content">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4>Generador de Presupuestos</h4>
                            <button class="btn btn-primary" onclick="showAddBudgetForm()">
                                <i class="bi bi-plus-circle"></i> Crear Presupuesto
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped align-middle">
                                <thead>
                                    <tr>
                                        <th>Código</th>
                                        <th>Proyecto</th>
                                        <th>Cliente</th>
                                        <th>Total</th>
                                        <th>Link FullScreen</th>
                                        <th style="width: 200px">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="budgetsList"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Tags Tab -->
                    <div class="tab-pane fade" id="tags-content">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4>Tags Library</h4>
                            <button class="btn btn-primary" onclick="showAddTagForm()">
                                <i class="bi bi-plus-circle"></i> Add New Tag
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped align-middle">
                                <thead>
                                    <tr>
                                        <th>Tag Name</th>
                                        <th>Created At</th>
                                        <th style="width: 150px">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tagsList"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals (Simplified versions of the improved one) -->
    <!-- Project Modal -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Project</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="projectForm">
                        <input type="hidden" id="projectId">
                        <div class="mb-3"><label class="form-label">Title</label><input type="text" class="form-control" id="title" required></div>
                        <div class="mb-3"><label class="form-label">URL</label><input type="url" class="form-control" id="projectUrl" required></div>
                        <div class="mb-3"><label class="form-label">Video Link</label><input type="url" class="form-control" id="videolink"></div>
                        <div class="mb-3"><label class="form-label">Thumbnail</label><input type="file" class="form-control" id="thumbnail" accept="image/*">
                        <div id="thumbnailPreview" class="mt-2"></div></div>
                        <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" id="description" rows="3" required></textarea></div>
                        <div class="mb-3"><label class="form-label">Tags (comma separated)</label><input type="text" class="form-control" id="tags"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveProject()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Budget Modal -->
    <div class="modal fade" id="budgetModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="budgetModalTitle">Budget</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="budgetForm">
                        <input type="hidden" id="budgetId"><input type="hidden" id="budgetCode">
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label">Nombre del Proyecto</label><input type="text" class="form-control" id="budgetProjectName" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Cliente</label><input type="text" class="form-control" id="budgetClient" required></div>
                        </div>
                        <div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" id="budgetDescription" rows="2" required></textarea></div>
                        <div class="mb-3"><label class="form-label">Condiciones de Pago</label><textarea class="form-control" id="budgetPaymentTerms" rows="2" required></textarea></div>
                        <div class="mb-3"><label class="form-label">Requerimientos Técnicos</label><textarea class="form-control" id="budgetTechnicalRequirements" rows="2" required></textarea></div>
                        
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label mb-0">Items</label>
                                <button type="button" class="btn btn-sm btn-success" onclick="addBudgetItem()"><i class="bi bi-plus"></i> Item</button>
                            </div>
                            <div id="budgetItemsContainer"></div>
                            <div class="mt-3 p-3 bg-light rounded"><h5 class="mb-0">Total: $<span id="budgetTotalDisplay">0.00</span></h5></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Referencias (Proyectos)</label>
                            <button type="button" class="btn btn-sm btn-outline-primary ms-2" onclick="toggleReferencesSelector()">Seleccionar</button>
                            <div id="selectedReferences" class="d-flex flex-wrap gap-2 mt-2"></div>
                            <div id="referencesSelector" class="border rounded p-2 mt-2" style="display:none; max-height:250px; overflow:auto;">
                                <input type="text" class="form-control mb-2" id="referencesSearch" placeholder="Buscar..." oninput="filterReferences()">
                                <div id="referencesTagFilters" class="mb-2"></div>
                                <div id="referencesList"></div>
                                <div id="referencePreview"></div>
                            </div>
                        </div>

                        <div id="budgetLinkDisplay" class="alert alert-info" style="display: none;">
                            <strong>Link:</strong> <a href="#" id="budgetFullScreenLink" target="_blank"></a>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" onclick="saveBudget()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tag Modal -->
    <div class="modal fade" id="tagModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">New Tag</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body"><div class="mb-3"><label class="form-label">Tag Name</label><input type="text" class="form-control" id="tagName" required></div></div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button type="button" class="btn btn-primary" onclick="saveTag()">Save</button></div>
        </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/budgets.js"></script>
</body>
</html>
